name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Non-blocking for now: the repo has pre-existing lint/formatting debt
      # (mostly Prettier quote/semicolon nits in Lovable-generated files) that
      # predates this workflow. Flip this to blocking once that's cleaned up.
      - name: Lint
        run: bun run lint
        continue-on-error: true

      - name: Type check
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
